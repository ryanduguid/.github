name: CodeRabbit review retrigger

# CodeRabbit reviews public repositories with fewer than 10 stars only on
# request, and its open-source tier admits one review per repository per hour.
# When several pull requests open within an hour, the per-repository trigger
# workflow's request is answered with a rate-limit notice and nothing follows
# up. This workflow runs hourly across the listed repositories, finds open
# pull requests whose latest CodeRabbit reply is a rate-limit notice (or that
# CodeRabbit never answered), and re-requests one review per repository. It
# waits at least 50 minutes after the previous request so the retry lands
# after the hourly window resets, comments with the CODERABBIT_TRIGGER_TOKEN
# secret because CodeRabbit ignores github-actions[bot], and never checks out
# or runs pull request code. Without the secret it only prints a warning.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List candidates without commenting
        type: boolean
        default: false

permissions: {}

concurrency:
  group: coderabbit-retrigger
  cancel-in-progress: false

jobs:
  retrigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      REPOS: >-
        .github Metanoia Ozzit TaxJarvis accounting-review-pipeline au-fpa-pack
        au-tax-legislation-corpus australian-accounting
        australian-accounting-skills github-agent-skills llm-tax-guardrails
        planning-analytics-model release-policy ryanduguid ryanduguid.github.io
    steps:
      - name: Report the missing secret
        if: ${{ !env.GH_TOKEN }}
        run: echo "::warning::CODERABBIT_TRIGGER_TOKEN is not set, so no review was requested."
      - name: Re-request rate-limited reviews
        if: env.GH_TOKEN != ''
        run: |
          set -euo pipefail
          owner="$GITHUB_REPOSITORY_OWNER"
          now=$(date -u +%s)
          requested=0
          for repo in $REPOS; do
            full="$owner/$repo"
            prs=$(gh pr list -R "$full" --state open --json number,isDraft,author \
              --jq '.[] | select(.isDraft | not) | select(.author.is_bot | not) | .number')
            for pr in $prs; do
              comments=$(gh api "repos/$full/issues/$pr/comments" --paginate \
                --jq '.[] | [.user.login, .created_at, (.body | gsub("<!--[^>]*-->|\n"; " ") | .[0:200])] | @tsv')
              last_reply=$(printf '%s\n' "$comments" \
                | awk -F '\t' '$1 == "coderabbitai[bot]" { r = $3 } END { print r }')
              last_request=$(printf '%s\n' "$comments" \
                | awk -F '\t' '$1 != "coderabbitai[bot]" && $3 ~ /@coderabbitai (full )?review/ { t = $2 } END { print t }')
              if [ -n "$last_reply" ] && ! printf '%s' "$last_reply" | grep -Eq 'Review limit reached|Review rate limited'; then
                continue
              fi
              if [ -n "$last_request" ] && [ $(( now - $(date -u -d "$last_request" +%s) )) -lt 3000 ]; then
                echo "$full#$pr: requested less than 50 minutes ago, waiting."
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then
                echo "$full#$pr: would request a review (dry run)."
              else
                gh pr comment "$pr" --repo "$full" --body "@coderabbitai review"
                echo "$full#$pr: review requested."
              fi
              requested=$((requested + 1))
              break
            done
          done
          echo "::notice::Requested $requested review(s) across the listed repositories."
