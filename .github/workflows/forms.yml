name: forms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yaml:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      # Computed from the v0.11.0 release tarball at pin time; koalaman
      # publishes no checksums file.
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify shellcheck
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - name: Shellcheck the commit-msg hook and its test
        run: |
          "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -x .githooks/commit-msg tests/test_commit_msg_hook.sh
      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
      - name: Lint the workflows with actionlint
        run: ./actionlint -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Validate the forms, chooser config and Dependabot config against GitHub's schemas
        run: |
          python -m pip install --only-binary :all: --require-hashes --requirement requirements-forms.txt
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml -print0 |
            xargs -0 check-jsonschema --builtin-schema vendor.github-issue-forms
          check-jsonschema --builtin-schema vendor.github-issue-config \
            .github/ISSUE_TEMPLATE/config.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
          # shortcut: the pinned issue form schema predates `min_length`, so check the
          # report form without it, then the original's `min_length` on its own, until
          # a check-jsonschema update accepts it.
          sed '/min_length:/d' .github/VULNERABILITY_REPORT.yml > "$RUNNER_TEMP/VULNERABILITY_REPORT.yml"
          check-jsonschema --builtin-schema vendor.github-issue-forms "$RUNNER_TEMP/VULNERABILITY_REPORT.yml"
          check-jsonschema --schemafile tests/report-form.schema.json .github/VULNERABILITY_REPORT.yml
      - name: Check the pull request template still has its required headings
        run: |
          for heading in "## What this changes" "## Why" "## Verification" "## Final review" "## Checklist"; do
            grep -qxF "$heading" .github/PULL_REQUEST_TEMPLATE.md || {
              echo "Missing heading in .github/PULL_REQUEST_TEMPLATE.md: $heading" >&2
              exit 1
            }
          done
