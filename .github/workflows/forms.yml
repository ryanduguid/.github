name: forms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Validate the forms, chooser config and Dependabot config against GitHub's schemas
        run: |
          python -m pip install --only-binary :all: --require-hashes --requirement requirements-forms.txt
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml -print0 |
            xargs -0 check-jsonschema --builtin-schema vendor.github-issue-forms
          check-jsonschema --builtin-schema vendor.github-issue-config \
            .github/ISSUE_TEMPLATE/config.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: Check the pull request template still has its required headings
        run: |
          for heading in "## What this changes" "## Why" "## Verification" "## Final review" "## Checklist"; do
            grep -qxF "$heading" .github/PULL_REQUEST_TEMPLATE.md || {
              echo "Missing heading in .github/PULL_REQUEST_TEMPLATE.md: $heading" >&2
              exit 1
            }
          done
