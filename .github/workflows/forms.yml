name: forms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse issue forms
        run: |
          python -m pip install "pyyaml==6.0.3"
          python -c "import pathlib,yaml; paths=list(pathlib.Path('.github/ISSUE_TEMPLATE').glob('*.yml'));
assert paths, 'no issue forms';
[yaml.safe_load(p.read_text(encoding='utf-8')) for p in paths];
print(f'parsed {len(paths)} forms')"
