name: forms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the forms, chooser config and Dependabot config against GitHub's schemas
        run: |
          python -m pip install "check-jsonschema==0.38.0"
          check-jsonschema --builtin-schema vendor.github-issue-forms \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml
          check-jsonschema --builtin-schema vendor.github-issue-config \
            .github/ISSUE_TEMPLATE/config.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
