name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Documentation cannot change the workflows this analyses, and CodeQL is not a
    # required check here, so a skipped run leaves nothing pending.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/llms.txt"
      - "**/CITATION.cff"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is cancelled. Every other run is keyed on its commit, so
# a later push to main cannot cancel or replace the analysis of an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    timeout-minutes: 15
    # The workflows are this repository's only code.
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload CodeQL results for this job only.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"
