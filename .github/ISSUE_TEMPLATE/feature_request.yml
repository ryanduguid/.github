name: Feature or change request
description: Propose a new capability, or a change to how an existing one behaves.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the accounting or engineering problem first. A proposal that
        starts from the workflow is far easier to evaluate than one that starts
        from the implementation.

  - type: checkboxes
    id: data-boundary
    attributes:
      label: Data boundary
      options:
        - label: This request contains no client, taxpayer, employee or payroll data and no credentials.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you doing manually, or getting wrong, today? Include how often
        it happens and what it currently costs you.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: The behaviour you want, including the inputs it would need.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Authority
      description: >
        If this encodes a rule, a rate, a deadline or a threshold, cite the
        primary source: the section of the Act, the legislative instrument, the
        ruling, or the ATO page. Requests that change a computed number will not
        be actioned without one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you looked at, and why they fell short.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        These projects produce evidence for a human reviewer. They do not post
        journals, move money, lodge with the ATO, or replace professional
        judgement.
      options:
        - label: This request keeps the final accounting or tax decision with a human.
          required: true
