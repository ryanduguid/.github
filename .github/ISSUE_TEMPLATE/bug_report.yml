name: Bug report
description: Something produced a wrong number, a wrong file, or an error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you fill this in: strip the data.

        Do not paste a real trial balance, payroll export, employee record,
        client name, ABN, TFN, tenant ID, token or API key into this form.
        Reproduce with fabricated values, or describe the shape of the data
        (column headers, row counts, value ranges) instead of the data.

  - type: checkboxes
    id: data-boundary
    attributes:
      label: Data boundary
      options:
        - label: This report contains no client, taxpayer, employee or payroll data and no credentials.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual result. Paste the exact error text or the wrong output.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        If this is a calculation, cite the source you are checking against:
        the section of the Act, the ATO page, the ruling, or the worked example.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The exact command or steps, plus the smallest fabricated input that
        still shows the problem. Attach the fabricated input file if it helps.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the commit SHA you are running.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        Operating system, and the runtime version that applies to this project:
        Python, Node, Excel and Power Query, or the agent host.
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Workarounds tried, related issues, or why you think it happens.
    validations:
      required: false
